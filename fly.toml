# fly launch --no-deploy --copy-config   (App-Name ggf. anpassen)
app = "eu-gewaehrleistungslabel"
primary_region = "fra"            # Frankfurt: Daten bleiben in der EU

[deploy]
  release_command = "npx prisma migrate deploy"   # Migrationen einmal pro Deploy, vor dem Start

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SHOPIFY_APP_URL = "https://eu-gewaehrleistungslabel.fly.dev"
  SCOPES = "write_products,read_inventory,write_files"   # wie access_scopes in shopify.app*.toml

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"      # Webhooks müssen in < 5 s beantwortet werden -> kein Kaltstart
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
